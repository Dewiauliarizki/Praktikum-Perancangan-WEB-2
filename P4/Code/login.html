<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - Sistem Penyewaan Lapangan Futsal</title>
<link rel="stylesheet" href="login.css">
</head>
<body>
<div class="container">
  <div class="brand">
    <h1>Futsal Booking — Login</h1>
    <p class="footer-note">Masuk untuk membuat atau melihat booking lapangan</p>
  </div>

  <!-- Pesan error/success dengan JavaScript -->
  <div id="flash-message"></div>

  <form action="auth.php" method="post" autocomplete="off">
    <div class="form-group">
      <label for="username">Nama Pengguna atau Email</label>
      <input id="username" name="username" type="text" required placeholder="username atau email">
    </div>

    <div class="form-group">
      <label for="password">Kata Sandi</label>
      <input id="password" name="password" type="password" required placeholder="password">
    </div>

    <button class="primary" type="submit">Masuk</button>
  </form>

  <p class="small">Belum punya akun? <a class="link" href="register.php">Daftar</a></p>
</div>

<script>
// Ambil query string dari URL
const params = new URLSearchParams(window.location.search);
const flashMessage = document.getElementById('flash-message');
if (params.has('error')) {
  const div = document.createElement('div');
  div.className = 'error';
  div.textContent = params.get('error');
  flashMessage.appendChild(div);
}
if (params.has('success')) {
  const div = document.createElement('div');
  div.className = 'success';
  div.textContent = params.get('success');
  flashMessage.appendChild(div);
}
</script>
</body>
</html>
